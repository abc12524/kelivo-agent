name: Build Kelivo Agent Linux (Debian 13 GNOME)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布到 Release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release 标签（留空自动使用 v<版本>，需匹配 v1.3.x）'
        required: false
        default: ''
        type: string
      prerelease:
        description: '是否为预发布版本 (Pre-release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.1'
  VERSION: 1.3.${{ github.run_number }}

jobs:
  debian13:
    name: 构建 Debian 13 (GNOME) .deb
    runs-on: ubuntu-24.04

    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: 📝 自动递增版本号
        shell: bash
        run: |
          sed -i "s/^version: .*/version: ${VERSION}/" pubspec.yaml
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="v${VERSION}"; fi
          case "$TAG" in
            v1.3.*) ;;
            *)
              echo "❌ Linux 通道的 Release 标签必须形如 v1.3.x，实际: $TAG"
              exit 1
              ;;
          esac
          echo "TAG=${TAG}" >> $GITHUB_ENV
          {
            echo 'CHANGES<<CHANGES_EOF'
            git log -1 --pretty=format:'%s%n%n%b'
            echo
            echo 'CHANGES_EOF'
          } >> $GITHUB_ENV
          echo "版本号: ${VERSION}（CI 运行号 ${{ github.run_number }}）"

      - name: 🏗️ 在 Debian 13 容器内构建并打包
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e VERSION -e VERSION_NUMBER="$VERSION" -e FLUTTER_VERSION \
            debian:trixie \
            bash /work/.github/scripts/build-linux-debian13.sh

      - name: 🧪 Debian 13 安装测试
        run: |
          docker run --rm -v "$PWD:/work" -w /work debian:trixie bash -lc '
            set -euo pipefail
            apt-get update
            apt-get install -y --no-install-recommends ./Kelivo_linux_*_debian13_amd64.deb
            dpkg -s kelivo | sed -n "1,12p"
            test -x /usr/bin/kelivo
            test -f /usr/share/applications/kelivo.desktop
            missing=$(for f in /opt/kelivo/kelivo /opt/kelivo/lib/*.so*; do
              LD_LIBRARY_PATH=/opt/kelivo/lib ldd "$f" 2>/dev/null \
                | grep "not found" \
                | sed "s|^|${f}: |" || true
            done)
            if [ -n "$missing" ]; then
              echo "❌ 存在未解析的动态库："
              echo "$missing"
              exit 1
            fi
            echo "✅ 动态库依赖完整"
          '

      - name: 📤 上传构建产物 (DEB)
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Debian13-DEB
          path: Kelivo_linux_*_debian13_amd64.deb
          if-no-files-found: error

      - name: 📤 上传构建产物 (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Debian13-tar.gz
          path: Kelivo_linux_*_debian13_amd64.tar.gz
          if-no-files-found: error

      - name: 🚀 发布到 Release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Kelivo ${{ env.TAG }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          body: |
            ${{ env.CHANGES }}

            ---
            - 版本: ${{ env.VERSION }}
            - 构建号: ${{ github.run_number }}
            - 提交: ${{ github.sha }}
          files: |
            Kelivo_linux_*_debian13_amd64.deb
            Kelivo_linux_*_debian13_amd64.tar.gz
          fail_on_unmatched_files: true
