name: Build Kelivo Agent

on:
  workflow_dispatch:

permissions:
  contents: write   # 需要写权限才能创建 Release

env:
  FLUTTER_VERSION: '3.44.x'
  VERSION: 1.1.${{ github.run_number }}
  TAG: v1.1.${{ github.run_number }}

jobs:
  android:
    name: 构建 Android (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: 🧹 Free disk space
        continue-on-error: true
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/heroku /opt/hostedtoolcache/go
          docker system prune -af 2>/dev/null || true
          df -h /

      - name: 🔑 写入签名密钥
        if: ${{ env.SIGN_KEYSTORE_BASE64 != '' }}
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          echo "storeFile=key.jks" >> android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "✅ 签名配置已写入"

      - name: 📝 自动递增版本号
        run: |
          sed -i "s/^version: .*/version: ${VERSION}/" pubspec.yaml
          echo "版本号: ${VERSION}（CI 运行号 ${{ github.run_number }}）"

      - name: 🏗️ 构建 Release APK (arm64-v8a)
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --split-debug-info=build/symbols --obfuscate

      - name: 📦 重命名 APK
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk "Kelivo_android_${VERSION}_arm64-v8a.apk"

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: kelivo-agent-arm64-v8a
          path: build/app/outputs/flutter-apk/Kelivo_android_*.apk
          if-no-files-found: error

      - name: 📤 上传调试符号（崩溃解析用）
        uses: actions/upload-artifact@v4
        with:
          name: kelivo-symbols-${{ env.VERSION }}
          path: build/symbols
          if-no-files-found: warn

  # Windows 构建（复用 build-stable-44.yml 的 Windows 作业）
  windows:
    name: 构建 Windows
    runs-on: windows-latest

    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 安装最新 CMake
        uses: lukka/get-cmake@latest

      - name: 🐦 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: 🔧 获取依赖
        run: flutter pub get

      - name: 🔍 验证 CMake 版本
        shell: pwsh
        run: |
          Write-Host "检查 CMake 版本..."
          cmake --version
          $cmakeVersion = (cmake --version | Select-String "cmake version" | ForEach-Object { $_.ToString() })
          Write-Host "当前 CMake: $cmakeVersion"

      - name: 📝 自动递增版本号
        shell: bash
        run: |
          sed -i "s/^version: .*/version: ${VERSION}/" pubspec.yaml
          echo "版本号: ${VERSION}（CI 运行号 ${{ github.run_number }}）"

      - name: 🏗️ 构建 Windows
        run: flutter build windows --release

      - name: 📦 打包 ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Kelivo_windows_$env:VERSION.zip"

      - name: 🔧 安装 Inno Setup
        run: choco install innosetup -y

      - name: 📦 创建安装程序
        shell: pwsh
        run: |
          # 语言文件检测（中文语言包在部分 Runner 缺失，避免编译失败）
          $zhLangCompiler = "C:\\Program Files (x86)\\Inno Setup 6\\Languages\\ChineseSimplified.isl"
          $zhLangLocalDir = Join-Path (Get-Location) "Languages"
          $zhLangLocal = Join-Path $zhLangLocalDir "ChineseSimplified.isl"
          $languagesBlock = $null
          if (Test-Path $zhLangCompiler) {
            Write-Host "✅ 检测到中文语言文件: $zhLangCompiler"
            $languagesBlock = @"
          [Languages]
          Name: "chinesesimplified"; MessagesFile: "compiler:Languages\ChineseSimplified.isl"
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
          } else {
            Write-Host "⚠️ 未在 Inno Setup 安装目录找到中文语言文件，尝试下载到本地项目..."
            try {
              New-Item -ItemType Directory -Force -Path $zhLangLocalDir | Out-Null
              $uri = 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl'
              Invoke-WebRequest -Uri $uri -OutFile $zhLangLocal -UseBasicParsing -TimeoutSec 60
              if (Test-Path $zhLangLocal) {
                Write-Host "✅ 已下载中文语言文件: $zhLangLocal"
                $languagesBlock = @"
          [Languages]
          Name: "chinesesimplified"; MessagesFile: "$zhLangLocal"
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
              }
            } catch {
              Write-Host "⚠️ 下载中文语言文件失败: $($_.Exception.Message)"
            }
            if (-not $languagesBlock) {
              Write-Host "ℹ️ 将仅包含英文安装向导"
              $languagesBlock = @"
          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
            }
          }
          # 创建 Inno Setup 脚本
          $issContent = @"
          #define MyAppName "Kelivo"
          #define MyAppVersion "$env:VERSION"
          #define MyAppPublisher "Psyche"
          #define MyAppExeName "kelivo.exe"
          [Setup]
          AppId={{A7B8C9D0-E1F2-4A5B-8C9D-0E1F2A3B4C5D}}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          OutputDir=.
          OutputBaseFilename=Kelivo_windows_{#MyAppVersion}_setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64
          ArchitecturesAllowed=x64
          UninstallDisplayIcon={app}\{#MyAppExeName}
          $languagesBlock
          [Tasks]
          Name: "desktopicon"; Description: "创建桌面快捷方式"; GroupDescription: "附加图标:"
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{group}\卸载 {#MyAppName}"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon
          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "启动 {#MyAppName}"; Flags: nowait postinstall skipifsilent
          "@

          # 使用 UTF-8 BOM 以确保中文字符在 Inno Setup 中正确解析
          $issContent | Out-File -FilePath "installer.iss" -Encoding utf8BOM

          # 编译安装程序
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: 📤 上传构建产物 (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Windows-ZIP
          path: Kelivo_windows_*.zip

      - name: 📤 上传构建产物 (Installer)
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: Kelivo_windows_*_setup.exe

  release:
    name: 发布 Release
    needs: [android, windows]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 🚀 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Kelivo v${{ env.VERSION }}
          body: |
            CI 自动构建
            - 版本: v${{ env.VERSION }}
            - 构建号: ${{ github.run_number }}
            - 提交: ${{ github.sha }}
            - 平台: Android arm64-v8a / Windows x64
          files: |
            dist/*.apk
            dist/*.zip
            dist/*.exe
          fail_on_unmatched_files: true
