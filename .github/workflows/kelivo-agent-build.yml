name: Build Kelivo Agent APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布到 Release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release 标签（留空自动使用 v<版本>，需匹配 v1.1.x）'
        required: false
        default: ''
        type: string
      prerelease:
        description: '是否为预发布版本 (Pre-release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # 需要写权限才能创建 Release

env:
  VERSION: 1.1.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: 🧹 Free disk space
        continue-on-error: true
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/heroku /opt/hostedtoolcache/go
          docker system prune -af 2>/dev/null || true
          df -h /

      - name: 🔑 写入签名密钥
        if: ${{ env.SIGN_KEYSTORE_BASE64 != '' }}
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          echo "storeFile=key.jks" >> android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "✅ 签名配置已写入"

      - name: 📝 自动递增版本号
        id: version
        run: |
          sed -i "s/^version: .*/version: ${VERSION}/" pubspec.yaml
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="v${VERSION}"; fi
          case "$TAG" in
            v1.1.*) ;;
            *)
              echo "❌ Android 通道的 Release 标签必须形如 v1.1.x，实际: $TAG"
              exit 1
              ;;
          esac
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "版本号: ${VERSION}（CI 运行号 ${{ github.run_number }}）"

      - name: 🏗️ 构建 Release APK (arm64-v8a)
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --split-debug-info=build/symbols --obfuscate

      - name: 📦 重命名 APK
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk "Kelivo_android_${VERSION}_arm64-v8a.apk"

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: kelivo-agent-arm64-v8a
          path: build/app/outputs/flutter-apk/Kelivo_android_*.apk
          if-no-files-found: error

      - name: 📤 上传调试符号（崩溃解析用）
        uses: actions/upload-artifact@v4
        with:
          name: kelivo-symbols-${{ env.VERSION }}
          path: build/symbols
          if-no-files-found: warn

      - name: 🚀 发布到 GitHub Release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Kelivo ${{ env.TAG }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          body: |
            CI 自动构建
            - 版本: ${{ env.VERSION }}
            - 构建号: ${{ github.run_number }}
            - 提交: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/Kelivo_android_*.apk
          fail_on_unmatched_files: true
