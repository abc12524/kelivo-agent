name: Build Kelivo Agent APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: 🧹 Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/heroku /opt/hostedtoolcache/go
          docker system prune -af 2>/dev/null || true
          df -h /

      - name: 🔑 Generate CI signing keystore
        run: |
          keytool -genkey -v -keystore android/app/ci-keystore.jks \
            -alias ci-key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ci-store-pass -keypass ci-store-pass \
            -dname "CN=CI, OU=Kelivo, O=Kelivo, L=Unknown, ST=Unknown, C=CN"
          cat > android/key.properties <<'PROPEOF'
          storeFile=ci-keystore.jks
          storePassword=ci-store-pass
          keyAlias=ci-key
          keyPassword=ci-store-pass
          PROPEOF

      - name: Build Release APK (signed with CI keystore)
        run: |
          rm -rf ~/.gradle
          flutter pub get
          flutter build apk --release --build-name="1.1.${{ github.run_number }}" --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kelivo-agent-debug
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.ref_name }}-${{ github.run_number }}
          prerelease: true
          files: build/app/outputs/flutter-apk/*.apk
