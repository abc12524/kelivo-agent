name: Build Kelivo Agent APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # 需要写权限才能创建 Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUB_HOSTED_URL: "https://pub.flutter-io.cn"
    container:
      image: flutter-build:local
      volumes:
        - /mnt/cache/gradle:/root/.gradle
        - /mnt/cache/pub:/root/.pub-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: 🧹 Free disk space
        continue-on-error: true
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/heroku /opt/hostedtoolcache/go
          docker system prune -af 2>/dev/null || true
          df -h /

      - name: 🔑 写入签名密钥
        if: ${{ env.SIGN_KEYSTORE_BASE64 != '' }}
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          echo "storeFile=key.jks" >> android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "✅ 签名配置已写入"

      - name: 📝 自动递增版本号
        id: version
        run: |
          RUN_NUM=${{ github.run_number }}
          VERSION="1.1.${RUN_NUM}"
          sed -i "s/^version: .*/version: ${VERSION}/" pubspec.yaml
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=v${VERSION}" >> $GITHUB_ENV
          echo "版本号: ${VERSION}（CI 运行号 ${RUN_NUM}）"

      - name: 🏗️ 构建 Release APK (arm64-v8a)
        run: |
          flutter pub get
          flutter build apk --release --split-debug-info=build/symbols --obfuscate

      - name: 📦 重命名 APK
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk "Kelivo_android_${VERSION}_arm64-v8a.apk"

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v3
        with:
          name: kelivo-agent-arm64-v8a
          path: build/app/outputs/flutter-apk/Kelivo_android_*.apk
          if-no-files-found: error

      - name: 📤 上传调试符号（崩溃解析用）
        uses: actions/upload-artifact@v3
        with:
          name: kelivo-symbols-${{ env.VERSION }}
          path: build/symbols
          if-no-files-found: warn

      - name: 🚀 发布到 Gitea Release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          API="http://192.168.30.181:3000/api/v1/repos/hollow/kelivo-agent"
          AUTH="Authorization: token $GITEA_TOKEN"
          # 已存在则复用，否则创建
          REL=$(curl -s -X POST "$API/releases" -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${{ env.TAG }}\",\"name\":\"Kelivo v${{ env.VERSION }}\",\"body\":\"CI 自动构建\\n- 版本: v${{ env.VERSION }}\\n- 构建号: ${{ github.run_number }}\\n- 提交: ${{ github.sha }}\",\"prerelease\":false}")
          REL_ID=$(echo "$REL" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          if [ -z "$REL_ID" ]; then
            REL_ID=$(curl -s "$API/releases/tags/${{ env.TAG }}" -H "$AUTH" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          fi
          echo "release id=$REL_ID"
          for f in build/app/outputs/flutter-apk/Kelivo_android_*.apk; do
            echo "uploading $f"
            curl -s -X POST "$API/releases/$REL_ID/assets?name=$(basename "$f")" \
              -H "$AUTH" -H "Content-Type: application/octet-stream" \
              --data-binary "@$f"
          done
          echo "✅ 已发布到 Release ${{ env.TAG }}"
